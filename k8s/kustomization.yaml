apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rv-analyzer
resources:
  - namespace.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
# Optional extras live in k8s/optional/ (ingress, Prometheus ServiceMonitor): copy what you need up here.
images:
  - name: rv-analyzer
    newName: ghcr.io/bagatron/rv-analyzer   # change to your own registry/fork if you build yourself
    newTag: latest                           # pin to a release, e.g. "0.3.0", for repeatable installs
