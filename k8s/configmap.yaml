apiVersion: v1
kind: ConfigMap
metadata:
  name: rv-config
data:
  RV_DATA_DIR: /data
  RV_MAX_UPLOAD_MB: "200"
  # To use Postgres instead of SQLite, put the URL in a Secret and reference it
  # from the Deployment as DATABASE_URL (see README).

  # ---- AI coach (optional) -------------------------------------------------
  # Feedback is generated by a model on the Open WebUI / Ollama laptop. Leave
  # RV_AI_BASE_URL or RV_AI_MODEL empty to keep the feature switched off.
  RV_AI_BACKEND: "openwebui"          # openwebui | ollama
  RV_AI_BASE_URL: ""                  # e.g. http://192.168.1.50:3000 (Open WebUI) or :11434 (Ollama)
  RV_AI_MODEL: ""                     # e.g. qwen2.5:7b-instruct; must exist on that machine
  RV_AI_AUTO: "true"                  # generate feedback after every analysis
  RV_AI_TIMEOUT_S: "600"
  RV_AI_NUM_CTX: "8192"               # used by the ollama backend only
  # RV_AI_API_KEY comes from the optional Secret "rv-ai" (see deployment.yaml / README)

  # ---- RV targets ------------------------------------------------------------
  RV_TARGET_PROVIDER: "auto"          # auto | wikimedia | pexels
  RV_CONTACT: ""                     # shown to Wikimedia in the User-Agent: your email or repo URL (optional)
  # RV_PEXELS_API_KEY comes from the optional Secret "rv-pexels" (see deployment.yaml / README)

  # ---- Logging and health probes ----------------------------------------------
  RV_LOG_LEVEL: "INFO"                # DEBUG also logs health-check and static requests
  RV_LOG_FORMAT: "json"               # json | text | auto
  RV_PROBE_INTERVAL_S: "30"           # database, data volume, workers
  RV_PROBE_AI_INTERVAL_S: "60"        # AI backend reachable, model present
  RV_PROBE_TARGET_INTERVAL_S: "900"   # image provider (downloads one test image each time)
  # Tracing (Tempo): uncomment and point at your Tempo distributor / OTLP receiver. Off when unset.
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.monitoring.svc:4318"
  # OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"   # or "grpc" with port 4317
  # Settings page: editing is allowed when RV_AUTH_USER/RV_AUTH_PASSWORD are set. Without a login, uncomment to allow it:
  # RV_SETTINGS_EDITABLE: "true"
