apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rv-analyzer
  annotations:
    # ingress-nginx defaults to a 1 MB body limit; EEG exports are bigger.
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    # The app has NO built-in login. Put auth in front of it, e.g. basic auth:
    # nginx.ingress.kubernetes.io/auth-type: basic
    # nginx.ingress.kubernetes.io/auth-secret: rv-basic-auth
    # nginx.ingress.kubernetes.io/auth-realm: "RV Analyzer"
spec:
  ingressClassName: nginx
  rules:
    - host: rv.example.com        # <-- change me (this file is optional: add it to kustomization.yaml to use it)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: rv-analyzer, port: {name: http}}
  # tls:
  #   - hosts: [rv.example.com]
  #     secretName: rv-tls
